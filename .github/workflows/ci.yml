name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=src/bluesky_graph_analytics --cov-report=term-missing --cov-fail-under=80
      - run: uv run bandit -r src/bluesky_graph_analytics -c pyproject.toml -ll
      - run: uv run detect-secrets scan --baseline .secrets.baseline
