[project]
name = "bluesky-graph-analytics"
version = "0.1.0"
description = "Bluesky social graph analytics — Phase 1 academic MVP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Bluesky Graph Analytics contributors" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx[http2]>=0.27",
    "tenacity>=9.0",
    "aiolimiter>=1.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "structlog>=24.0",
    "sentry-sdk>=2.0",
    "opentelemetry-api>=1.28",
    "typer>=0.12",
    "returns>=0.23",
    "PyYAML>=6.0",
    "atproto>=0.0.50",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "networkx>=3.4",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "node2vec>=0.4",
    "gensim>=4.3",
    "langdetect>=1.0",
    "nltk>=3.9",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "pyvis>=0.3",
    "streamlit>=1.40",
    "setuptools>=69.0,<81",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "respx>=0.21",
    "black>=24.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "types-networkx>=3.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
bga = "bluesky_graph_analytics.interfaces.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluesky_graph_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bluesky_graph_analytics"]
mypy_path = "src"
namespace_packages = false

[[tool.mypy.overrides]]
module = [
    "leidenalg.*",
    "igraph.*",
    "gensim.*",
    "node2vec.*",
    "sklearn.*",
    "atproto.*",
    "langdetect.*",
    "pandas.*",
    "scipy.*",
    "nltk.*",
    "pyvis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bluesky_graph_analytics.domain.graph.*"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bluesky_graph_analytics.infrastructure.tracing"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "bluesky_graph_analytics.domain.similarity.*",
    "bluesky_graph_analytics.domain.community.*",
    "bluesky_graph_analytics.domain.prediction.*",
]
disable_error_code = ["type-arg", "var-annotated"]

[tool.coverage.run]
source = ["bluesky_graph_analytics"]
omit = [
    "*/interfaces/streamlit/*",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic/versions"]
